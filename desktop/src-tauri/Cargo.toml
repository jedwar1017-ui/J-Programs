[package]
name = "growth-os-desktop"
version = "0.1.0"
description = "J-Programs Growth OS — Windows desktop shell around the existing web dashboard"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
